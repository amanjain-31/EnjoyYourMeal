{% extends "base.html" %}

{% block class %}class="sub_page"{% endblock class %}
{% block table_status %}active{% endblock table_status %}
{% block main %}
<style>
  /* Premium Book Table UI */
  .premium-book-section {
      background: linear-gradient(135deg, #1f1c2c, #928DAB) !important;
      padding: 80px 0;
      color: #fff;
  }
  .premium-book-section .heading_container h2 {
      color: #ffbe33; 
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 30px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .premium-book-section .form_container {
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
  }
  .premium-book-section .form-control {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #fff !important;
      border-radius: 10px;
  }
  .premium-book-section .form-control::placeholder {
      color: #ddd !important;
  }
  .premium-book-section .form-control option {
      background: #1f1c2c;
      color: #fff;
  }
  .premium-book-section .btn_box button {
      background: linear-gradient(45deg, #ffbe33, #e6a524) !important;
      border: none;
      color: #111 !important;
      border-radius: 50px;
      padding: 12px 35px;
      font-weight: 800;
      text-transform: uppercase;
      transition: all 0.3s ease;
  }
  .premium-book-section .btn_box button:hover {
      box-shadow: 0 8px 25px rgba(255, 190, 51, 0.6);
      transform: translateY(-3px);
  }
</style>

<!-- book section -->
<section class="book_section premium-book-section layout_padding">
  <div class="container">
    <div class="heading_container">
      <h2>
        Book A Table
      </h2>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form_container">
          <!-- Display messages here -->
          {% if messages %}
          <div class="alert alert-info">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
          {% endif %}

          <form action="{% url 'Book_Table' %}" method='POST'>{% csrf_token %}
            <div>
              <input type="text" class="form-control" name="user_name" required placeholder="Your Name" />
            </div>
            <div>
              <input type="text" class="form-control" name="phone_number" required placeholder="Phone Number" />
            </div>
            <div>
              <input type="email" class="form-control" name="user_email" placeholder="Your Email" />
            </div>
            <div>
              <select class="form-control nice-select wide" required name="total_person">
                <option value="" disabled selected>
                  How many persons?
                </option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </div>
            <div>
              <input type="date" required name="booking_data" class="form-control">
            </div>
            <div class="btn_box">
              <button>
                Book Now
              </button>
            </div>
          </form>
        </div>
      </div>
      
      <!-- Google Map section -->
      <div class="col-md-6">
        <div class="map_container">
          <div id="googleMap" style="height: 400px; width: 100%;"></div> <!-- Ensure the map has a height and width -->
        </div>
      </div>
    </div>
  </div>
</section>
<!-- end book section -->

<!-- Add the Google Maps API -->
<script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&callback=initMap" async defer></script>

<!-- Initialize Google Map -->
<script>
function initMap() {
  // Set the location of your restaurant (replace with your actual coordinates)
  var restaurantLocation = { lat: 26.8467, lng: 80.9462 }; // Example coordinates (change these)

  // Create the map centered on the restaurant
  var map = new google.maps.Map(document.getElementById('googleMap'), {
    zoom: 14,  // Set zoom level
    center: restaurantLocation  // Set map's center
  });

  // Add a marker at the restaurant's location
  var marker = new google.maps.Marker({
    position: restaurantLocation,
    map: map,
    title: 'Your Restaurant Name'  // Change this to your restaurant's name
  });
}
</script>

{% endblock main %}
